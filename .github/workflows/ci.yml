name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build i testy (Windows)
    runs-on: windows-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ZseAdmin.sln

      - name: Build
        run: dotnet build ZseAdmin.sln -c Release --no-restore

      - name: Testy
        run: dotnet test ZseAdmin.sln -c Release --no-build --logger "trx;LogFileName=testy.trx"

      - name: Publikacja serwera
        run: dotnet publish src/ZseAdmin.Server -c Release --no-build -o artifacts/server

      - name: Kontrola artefaktu (definicja pracowni w publikacji)
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/server/classrooms.json)) {
            Write-Error "Brak classrooms.json w artefakcie — serwer nie wystartuje w trybie AD."
            exit 1
          }

      - name: Publikacja klienta
        run: dotnet publish src/ZseAdmin.Client -c Release --no-build -o artifacts/client

      - name: Artefakty
        uses: actions/upload-artifact@v4
        with:
          name: zse-admin-build
          path: |
            artifacts/server
            artifacts/client
          if-no-files-found: error
